version: "3.8"

services:
  postgres:
    image: postgres:15
    container_name: agent360-postgres
    environment:
      POSTGRES_DB: agent360
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - agent360-network

volumes:
  postgres_data:

networks:
  agent360-network:
    driver: bridge
